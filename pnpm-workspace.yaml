# Shared kits install from their released owner artifacts.
# pnpm 11 blocks dependency build scripts by default; allow only what we trust.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Git dep needs its prepare build; pnpm demands the exact resolved URL (the
  # same shape loki uses). If the listkit pin moves, pnpm prints the new key.
  listkit@https://codeload.github.com/bitbaum/listkit/tar.gz/69cb4f4ef12d6a2a56b56db1bb4d4ac14aced525: true

# Our own packages are published by our own tagged workflows; minimumReleaseAge
# would refuse each fresh publish until it ages. One scope glob covers every
# @bitbaum package; the four unscoped ones are named (fleet SHARED.md).
minimumReleaseAgeExclude:
  - "@bitbaum/*"
  - limitkit
  - bip-kit
  - threadkit
  - ai-forms
