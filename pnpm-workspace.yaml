# pnpm 11 blocks dependency build scripts by default; allow only what we trust.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Git dep needs its prepare build; pnpm demands the exact resolved URL (the
  # same shape loki uses). If the listkit pin moves, pnpm prints the new key.
  listkit@https://codeload.github.com/bitbaum/listkit/tar.gz/69cb4f4ef12d6a2a56b56db1bb4d4ac14aced525: true

# Our own packages, exempt from the minimum-release-age supply-chain window BY
# NAME. A version-pinned entry refuses every release not listed in it, so a
# fix shipped upstream could not be installed until someone edited this file
# (the fleet-wide trap of 2026-09-11). Third-party packages keep the window.
minimumReleaseAgeExclude:
  - '@bitbaum/sitekit'
  - '@bitbaum/ai-kit'
  - '@bitbaum/geo-kit'
  - bip-kit
