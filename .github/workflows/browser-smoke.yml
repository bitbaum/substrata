name: Chart consumer browser smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: chart-browser-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm config set store-dir ~/.pnpm-store --global
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm run build
      - name: Exercise actual country and resource charts
        run: |
          set -euo pipefail
          pnpm run start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/substrata-browser-server.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/resources/gallium > /dev/null; then break; fi
            sleep 1
          done
          pnpm run check:places-layout --base http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-consumer-layouts
          path: layout-artifacts/
          if-no-files-found: ignore
